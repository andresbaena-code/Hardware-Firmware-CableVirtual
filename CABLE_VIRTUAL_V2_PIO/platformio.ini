; =============================================================================
;  WIGA Cable Virtual - Firmware de control de valvulas latch por Modbus RTU
;  Migracion: XBee → Modbus/RS485/LoRaWAN (UC100-915M)
;  Especificacion: specs/001-migracion-platformio/
; =============================================================================

[platformio]
default_envs = megaatmega2560

; -----------------------------------------------------------------------------
;  EL AREA DE TRABAJO VIVE FUERA DE LA CARPETA SINCRONIZADA
;
;  Este repositorio esta dentro de una biblioteca de OneDrive/SharePoint
;  ("GR Chia S.A.S\Wiga Electronica - Documentos"), que es un punto de
;  reanalisis con sincronizacion activa. Compilar ahi NO funciona de forma
;  fiable: .pio/build genera miles de ficheros objeto que OneDrive intenta
;  sincronizar y acaba deslocalizando o retirando A MITAD DE COMPILACION.
;
;  Sintoma exacto que provoco, verificado el 2026-09-07: avrdude escribio la
;  Flash entera (12304 bytes, 100%) y acto seguido la verificacion fallo con
;
;      avrdude: can't open input file .piouild\megaatmega2560irmware.hex:
;               No such file or directory
;
;  El .hex existia al empezar a escribir y ya no existia un segundo despues. El
;  directorio de build habia quedado con solo dos ficheros. No era un problema
;  de avrdude ni del programador: era el sincronizador borrando artefactos.
;
;  Con el area de trabajo fuera de la biblioteca el problema desaparece, y de
;  paso la compilacion es bastante mas rapida porque no se sincroniza nada.
;  El codigo fuente sigue versionado y sincronizado con normalidad; lo unico
;  que se mueve es lo generado, que ya estaba en .gitignore.
; -----------------------------------------------------------------------------
workspace_dir = ${sysenv.LOCALAPPDATA}/PlatformIO/workspaces/wiga_cable_virtual

[env]
; C++14 es necesario para constexpr con bucles en la validacion del mapa (R-010).
build_unflags = -std=gnu++11
build_flags   = -std=gnu++14

; -----------------------------------------------------------------------------
;  Produccion: Arduino Mega 2560
; -----------------------------------------------------------------------------
[env:megaatmega2560]
platform      = atmelavr
board         = megaatmega2560
framework     = arduino
monitor_speed = 9600
build_flags   = ${env.build_flags} -DWIGA_LOG_LEVEL=3

; ESTA PLACA LLEVA UN ATmega2560V CON CRISTAL DE 8 MHz, no los 16 MHz que la
; definicion de placa de PlatformIO da por supuestos.
;
; Sin esta linea TODO tiempo calculado sale al doble, y lo primero que rompe es
; la velocidad serie: el registro UBRR se calcula para 16 MHz (UBRR=103 para
; 9600), y a 8 MHz reales eso transmite a 4808 baudios. El bus parece mudo
; porque en realidad habla a la mitad de velocidad.
;
; Tambien afectaba a millis(), y con ello al antirrebote y a la temporizacion
; del transceptor RS485.
board_build.f_cpu = 8000000L

; Se carga con el programador USBtinyISP por el conector ICSP, no por el
; bootloader. A diferencia del IDE de Arduino -donde elegir el programador en el
; menu NO basta y hay que usar "Subir usando programador"-, aqui declararlo es
; suficiente: `pio run -t upload` ya pasa por el programador.
;
; OJO: cargar por ISP BORRA el bootloader. A partir de ahi no se puede volver a
; cargar por USB serie hasta grabarlo de nuevo con `pio run -t bootloader`.
upload_protocol = usbtiny

; -----------------------------------------------------------------------------
;  POR QUE EL BORRADO DEL CHIP ES OBLIGATORIO (el "-e" de mas abajo)
;
;  PlatformIO anade SIEMPRE "-D" (disable auto erase) en su builder
;  (platforms/atmelavr/builder/main.py, linea 49), sin condicionarlo al
;  protocolo. Para el bootloader es correcto -borra pagina a pagina mientras
;  escribe- pero por ISP nadie borra, y la Flash solo puede pasar bits de 1 a 0.
;  Escribir sobre el programa anterior deja intactos los bits que deberian
;  subir a 1, y la verificacion falla en el primer byte afectado:
;
;      avrdude: verification error, first mismatch at byte 0x0002
;               0x90 != 0x92          0x90 = 1001 0000
;                                     0x92 = 1001 0010  <- el bit 1 no puede subir
;
;  Al definir upload_command a mano ya no interviene ese "-D", y el "-e"
;  explicito garantiza el borrado. El fusible EESAVE esta programado en esta
;  placa, asi que el borrado conserva la EEPROM.
;
;  FUSIBLES VERIFICADOS el 2026-09-08 leyendo el chip real (avrdude 8.0) y
;  decodificados bit a bit contra el datasheet DS40002211A (Tablas 10-1, 10-5,
;  10-6, 30-3, 30-4, 30-5):
;
;      lfuse = 0xF7  -> CKSEL3:0=0111 = Full Swing Crystal Oscillator,
;                       rango 0.4-16 MHz (cubre el cristal de 8 MHz de esta
;                       placa). NO es el valor de fabrica (que seria 0x62,
;                       oscilador interno): esta grabado a proposito.
;      hfuse = 0xD7  -> BOOTRST sin programar (arranca directo a la app en
;                       0x0000, sin bootloader), EESAVE programado, SPIEN
;                       programado (ISP habilitado), JTAGEN sin programar.
;      efuse = 0xFD  -> BODLEVEL2:0=101, deteccion de bajo voltaje activa
;                       (~2.7 V), no desactivada.
;
;  Conclusion: el reloj del chip NUNCA fue la causa de los problemas de carga
;  de ese dia (fueron el driver USB del programador y un ICSP mal asentado).
; -----------------------------------------------------------------------------
;  QUE AVRDUDE SE USA, Y POR QUE DEPENDE DEL PUERTO USB
;
;  Hay dos avrdude en esta maquina y usan backends USB distintos:
;
;    - El de PlatformIO (6.3, de 2016) lleva libusb0.dll al lado: habla
;      libusb-win32 y SOLO libusb-win32.
;    - El del core MegaCore (8.0) esta construido sobre libusb-1.0.
;
;  Y el programador USBtinyISP esta registrado en Windows con AMBOS drivers, uno
;  por cada puerto USB en el que se haya enchufado alguna vez. `Get-PnpDevice`
;  sobre VID_1781 devuelve siete instancias: seis de clase "libusb-win32
;  devices" (servicio libusb0) y una de clase "USBDevice" (servicio WinUSB).
;
;  CONSECUENCIA PRACTICA: cual de los dos avrdude funciona depende del puerto en
;  el que este enchufado el programador. Si no coinciden backend y driver, el
;  fallo es enganoso porque parece que el programador no esta:
;
;      Warning: cannot open USB device: Permission denied   <- libusb-1.0
;      Error: cannot find USBtiny device (0x1781/0xc9f)
;
;  El "Permission denied" es la pista: el dispositivo ESTA, pero ese backend no
;  puede abrirlo. Comprobado el 2026-09-07 con el programador en un puerto de
;  driver libusb0: el 8.0 daba ese error y el 6.3 respondia
;
;      Device signature = 0x1e9801 (probably m2560)
;      safemode: Fuses OK (E:FD, H:D6, L:F7)
;
;  SI LA CARGA FALLA CON ESE MENSAJE, hay dos salidas:
;    1. Cambiar el programador a otro puerto USB, hasta que el driver del puerto
;       coincida con el avrdude activo. Es lo mas rapido y no toca el sistema.
;    2. Cambiar la linea activa de abajo por la del otro avrdude.
;
;  Para saber que driver tiene el puerto actual:
;      Get-PnpDevice | ? { $_.InstanceId -match 'VID_1781' } | ft FriendlyName,Status,Service
;  La instancia con Status "OK" es la conectada; las "Unknown" son fantasmas.
;
;  La solucion de fondo, que no se aplica aqui porque toca drivers del sistema,
;  es reenlazar todas las instancias al mismo driver con Zadig.
; -----------------------------------------------------------------------------

; ALTERNATIVA: avrdude 6.3 de PlatformIO (libusb-win32). Sin dependencias
; externas. Para volver a usarlo, comentar las dos lineas de abajo y
; descomentar estas dos:
; custom_avrdude_bin = ${platformio.packages_dir}/tool-avrdude/avrdude.exe
; custom_avrdude_cfg = ${platformio.packages_dir}/tool-avrdude/avrdude.conf

; ACTIVO: avrdude 8.0 de MegaCore (libusb-1.0). Requiere el core MegaCore
; instalado en el IDE de Arduino.
;
; Cambiado el 2026-09-08: quemar el bootloader desde Arduino+MegaCore
; reenlazo el driver del puerto USB del programador de libusb0 a WinUSB (lo
; hace el propio instalador de MegaCore). Desde entonces el 6.3 -que solo
; habla libusb-win32- deja de encontrar el programador en ese puerto:
;
;     avrdude.exe: Error: Could not find USBtiny device (0x1781/0xc9f)
;
; Si en el futuro esto vuelve a fallar al reves -"Permission denied" en vez de
; "Could not find"-, es que el puerto volvio a libusb0: cambiar a la
; alternativa de arriba, o revisar el driver con Zadig.
custom_avrdude_bin = ${sysenv.LOCALAPPDATA}/Arduino15/packages/MegaCore/tools/avrdude/8.0-arduino.1/bin/avrdude.exe
custom_avrdude_cfg = ${sysenv.LOCALAPPDATA}/Arduino15/packages/MegaCore/tools/avrdude/8.0-arduino.1/etc/avrdude.conf

; EN UNA SOLA LINEA, a proposito: PlatformIO ejecuta cada linea de un
; upload_command multilinea como un COMANDO INDEPENDIENTE. Partirlo hacia que
; avrdude corriera sin argumentos y que "-C", "-c" y "-U" se intentaran ejecutar
; como programas, con el agravante de que la tarea terminaba en SUCCESS sin
; haber subido nada.
upload_command = "${this.custom_avrdude_bin}" -C "${this.custom_avrdude_cfg}" -c usbtiny -p $BOARD_MCU -e -U flash:w:$SOURCE:i

lib_deps =
    ; Migracion: XBee eliminado. Modbus RTU implementado internamente.
    ; No se requiere libreria externa: el CRC16 y el tramado viven en
    ; lib/wiga_modbus, del lado comprobable de la barrera de capas.
    marcoschwartz/LiquidCrystal_I2C@1.1.4

; -----------------------------------------------------------------------------
;  Produccion sin trazas de diagnostico (FR-029).
;  Mismo binario funcional, ~790 B menos de Flash y ~104 B menos de RAM.
;  Compilar con este entorno NO debe cambiar ningun comportamiento de control.
; -----------------------------------------------------------------------------
[env:megaatmega2560_silent]
extends     = env:megaatmega2560
build_flags = ${env.build_flags} -DWIGA_LOG_LEVEL=0

; -----------------------------------------------------------------------------
;  Pruebas en host (Windows). El toolchain lo gestiona PlatformIO: no requiere
;  instalar MinGW ni Visual Studio en el equipo (research.md R-013).
;
;  lib_ignore = wiga_hal hace ESTRUCTURAL la barrera de capas del Principio III:
;  si el dominio o el control incluyen <Arduino.h>, esta compilacion falla.
; -----------------------------------------------------------------------------
[env:native]
platform       = windows_x86
test_framework = unity
lib_ignore     = wiga_hal
test_build_src = no
; -Itest/mocks expone los dobles de prueba a todas las suites.
build_flags    = ${env.build_flags} -DWIGA_HOST_TEST -DWIGA_LOG_LEVEL=0 -Itest/mocks

; -----------------------------------------------------------------------------
;  Pruebas en host (Linux / macOS). Usa el compilador del sistema.
; -----------------------------------------------------------------------------
[env:native_posix]
platform       = native
test_framework = unity
lib_ignore     = wiga_hal
test_build_src = no
; -Itest/mocks expone los dobles de prueba a todas las suites.
build_flags    = ${env.build_flags} -DWIGA_HOST_TEST -DWIGA_LOG_LEVEL=0 -Itest/mocks
